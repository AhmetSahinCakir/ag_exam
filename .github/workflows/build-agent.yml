name: build-agent

# Üç dosya üretir ve hepsini gerçek Windows üzerinde dener:
#
#   SinavIzleme-Kurulum.exe  sınavı yapan kişinin bilgisayarı için kurulum (Python, paketler,
#                            MediaMTX ve öğrenci programı içinde; internet gerekmez)
#   SinavAjan-Kurulum.exe    öğrenci bilgisayarı için kurulum
#   SinavAjan.exe            öğrenci programının kurulumsuz, tek dosyalık hâli (ffmpeg içinde)
#
# Dosyalar zip'lenmeden, kendi adlarıyla artifact olarak yüklenir (90 gün saklanır).
# v ile başlayan bir etiket (ör. v1.0.0) oluşunca iki kurulum dosyası o etiketin GitHub
# Release'ine eklenir (sürüm yoksa TASLAK olarak oluşturulur; taslak, depo sahibinin
# "Publish release" demesiyle herkese açılır).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Çekirdek testleri (izin listesi, denetim mantığı, ffmpeg komutu)
        run: dotnet run --project agent/tests/CoreSmoke -c Release

      # agent\ffmpeg.exe: derleme bunu sıkıştırıp SinavAjan.exe'nin içine gömer.
      # Betik, kullanıcıların çalıştırdığı gibi Windows'un kendi PowerShell'i ile çalışır.
      - name: ffmpeg.exe indir
        shell: powershell
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Ajanı yayınla (tek dosya, win-x64, ffmpeg içinde)
        run: dotnet publish agent/SinavAjan.csproj -c Release -o publish

      - name: Paket tek dosya mı?
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish -Recurse -File)
          $files | Format-Table Name, Length
          if ($files.Count -ne 1 -or $files[0].Name -ne 'SinavAjan.exe') { throw 'publish klasöründe yalnızca SinavAjan.exe olmalı' }
          if ($files[0].Length -lt 80MB) { throw 'ffmpeg, SinavAjan.exe içine gömülmemiş görünüyor' }

      # Kurulumun içine konacak Python (tam kurulum; kopyası alınır).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Kurulum dosyalarını üret (sistem + öğrenci)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.0.1' }
          ./installer/hazirla.ps1 -AgentExe publish/SinavAjan.exe -OutDir publish -Version $version

      # Zip'lenmeden yüklenir: indirilen dosya doğrudan çalıştırılabilir.
      - uses: actions/upload-artifact@v7
        with:
          path: publish/SinavAjan.exe
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: publish/SinavIzleme-Kurulum.exe
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: publish/SinavAjan-Kurulum.exe
          archive: false
          if-no-files-found: error

  # Ajanı gerçek Windows üzerinde çalıştırır: sınav klasörü, keşif, giriş, ekran yayını ve kaydı,
  # izinsiz programların kapatılması, öndeki pencere toleransı, başka masaüstüne geçiş, dosya
  # seçerek teslim ve teslim klasörü denetimi, ajan kapanınca ffmpeg'in de kapanması.
  # Öğrencinin elindeki tek dosya (SinavAjan.exe) Türkçe karakterli bir klasörden çalıştırılır.
  windows-e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # En yeni Python (python.org'dan bugün indirilen sürüm) ve desteklenen en eski sürüm.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Sunucu testleri (Windows, Python 3.15)
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements-dev.txt
          python -m pytest server/tests -q

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sunucu testleri (Windows, Python 3.11)
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements-dev.txt
          python -m pytest server/tests -q

      # Kullanıcının ilk çalıştırması: sistem, adı Türkçe karakter ve boşluk içeren bir klasöre
      # açılmış; start-teacher.bat Python ortamını kurup MediaMTX'i indirir. Betikler burada
      # Windows'un kendi PowerShell'i (5.1) ile çalışır; pwsh 7'de görünmeyen hatalar burada çıkar.
      - name: İlk kurulum klasörünü hazırla (Türkçe karakterli yol)
        shell: powershell
        run: |
          $u = [string][char]0xFC; $i = [string][char]0x131; $g = [string][char]0x11F
          $hedef = Join-Path $env:RUNNER_TEMP ("Masa${u}st${u}\a${g} s${i}nav${i}\ag_exam-main")
          New-Item -ItemType Directory -Force -Path $hedef | Out-Null
          foreach ($ad in 'scripts', 'server', 'mediamtx') { Copy-Item -Recurse -Path $ad -Destination (Join-Path $hedef $ad) }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ILK_KURULUM=$hedef`n", (New-Object Text.UTF8Encoding $false))
          Write-Host "Klasör: $hedef"

      # Sırayla: ilk kurulum; betiğin -OutDir verilmeden (belgelendiği gibi) çalışması;
      # her şey hazırken ikinci çalıştırma.
      - name: İlk kurulum (start-teacher.bat --setup, Türkçe karakterli yol)
        shell: cmd
        run: |
          call "%ILK_KURULUM%\scripts\start-teacher.bat" --setup < nul
          if errorlevel 1 exit /b 1
          if not exist "%ILK_KURULUM%\mediamtx\mediamtx.exe" exit /b 1
          "%ILK_KURULUM%\.venv\Scripts\python.exe" -c "import fastapi, uvicorn, yaml, openpyxl, multipart; print('paketler tamam')"
          if errorlevel 1 exit /b 1
          del "%ILK_KURULUM%\mediamtx\mediamtx.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%ILK_KURULUM%\scripts\fetch-mediamtx.ps1"
          if errorlevel 1 exit /b 1
          if not exist "%ILK_KURULUM%\mediamtx\mediamtx.exe" exit /b 1
          call "%ILK_KURULUM%\scripts\start-teacher.bat" --setup < nul
          if errorlevel 1 exit /b 1

      - uses: actions/download-artifact@v8
        with:
          name: SinavAjan.exe
          path: publish

      - uses: actions/download-artifact@v8
        with:
          name: SinavIzleme-Kurulum.exe
          path: publish

      - uses: actions/download-artifact@v8
        with:
          name: SinavAjan-Kurulum.exe
          path: publish

      - name: MediaMTX indir
        shell: pwsh
        run: ./scripts/fetch-mediamtx.ps1

      - name: start-teacher.bat güvenlik duvarı kuralları
        shell: cmd
        run: |
          call scripts\start-teacher.bat --firewall < nul
          netsh advfirewall firewall show rule name="Sinav Izleme - Kesif (UDP 47000)" || exit /b 1
          netsh advfirewall firewall show rule name="Sinav Izleme - API (TCP 8000)" || exit /b 1
          netsh advfirewall firewall show rule name="Sinav Izleme - RTSP (TCP 8554)" || exit /b 1

      - name: Uçtan uca test (ajan + sunucu + MediaMTX)
        shell: powershell
        run: ./agent/tests/E2E/windows-e2e.ps1 -AgentDir publish

      # Kullanıcının yapacağı: kurulum dosyasını çalıştır, masaüstündeki simgeden başlat, kaldır.
      - name: Kurulum dosyalarının denemesi (kur, masaüstünden başlat, kaldır)
        shell: powershell
        run: ./installer/kurulum-testi.ps1 -SetupDir publish

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-e2e-cikti
          path: e2e-out/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SinavIzleme-Kurulum.exe
          path: paket

      - uses: actions/download-artifact@v8
        with:
          name: SinavAjan-Kurulum.exe
          path: paket

      # Bu etiket için bir sürüm (ya da taslağı) varsa dosyaları yenilenir; yoksa TASLAK
      # oluşturulur. Taslağı yayımlamak depo sahibinin kararıdır.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release upload "$TAG" paket/SinavIzleme-Kurulum.exe paket/SinavAjan-Kurulum.exe \
               --repo "$GITHUB_REPOSITORY" --clobber; then
            echo "Var olan sürümün dosyaları yenilendi."
            exit 0
          fi
          gh release create "$TAG" paket/SinavIzleme-Kurulum.exe paket/SinavAjan-Kurulum.exe \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "Sınav İzleme Sistemi $TAG" \
            --notes "**Sınavı yapacak kişi:** \`SinavIzleme-Kurulum.exe\` dosyasını indirip çalıştırın; masaüstüne **Sınav İzleme Sistemi** simgesi gelir.

          **Öğrenciler:** \`SinavAjan-Kurulum.exe\` dosyasını indirip çalıştırın; masaüstüne **Sınav Ajanı** simgesi gelir.

          Kullanım kılavuzu: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/KURULUM.md"
